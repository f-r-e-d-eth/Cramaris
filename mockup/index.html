<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnDeCrypt UI Mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL VAULT // LIVE DECRYPT</div>
        <div class="title-row">
          <h1>EnDeCrypt</h1>
          <div id="activeFilename" class="title-filename">secret.bla</div>
        </div>
      </div>
      <div class="vault-info">
        <div class="vault-path">~/EnDeCrypt/vault</div>
        <button id="clockDisplay" class="clock-display" type="button" title="Click to change clock mode">10:09</button>
      </div>
    </header>

    <section class="password-panel">
      <div class="password-grid">
        <div class="password-field">
          <label for="masterPassword">Master Password</label>
          <div class="password-row">
            <input id="masterPassword" type="password" value="master" autocomplete="off">
            <button id="toggleMasterPassword" class="ghost-button" type="button">SHOW</button>
          </div>
        </div>

        <div class="password-field key-field">
          <label for="secondaryKey">Key</label>
          <div class="password-row">
            <input id="secondaryKey" type="password" value="apple" autocomplete="off">
            <button id="toggleSecondaryKey" class="ghost-button" type="button">SHOW</button>
            <button id="cryptoToggle" class="ghost-button crypto-toggle active" type="button">CRYPT ON</button>
          </div>
        </div>
      </div>
      <div class="hint">Changing either field updates the visible interpretation immediately.</div>
    </section>

    <main class="workspace">
      <aside class="sidebar">
        <div class="section-heading">FILES</div>
        <button class="file-item active" data-file="secret.bla">
          <span>secret.bla</span>
          <small>3 lines</small>
        </button>
        <button class="file-item" data-file="ideas.dat">
          <span>ideas.dat</span>
          <small>4 lines</small>
        </button>
        <button class="file-item" data-file="journal.enc">
          <span>journal.enc</span>
          <small>5 lines</small>
        </button>

        <div class="sidebar-spacer"></div>

        <div class="appearance-control">
          <div class="transparency-label">
            <span>GLASS</span>
            <span id="transparencyValue">55%</span>
          </div>
          <input id="transparencySlider" type="range" min="0" max="90" value="20">

          <div class="appearance-row">
            <button id="backgroundButton" class="action-button compact">SWITCH BACKGROUND</button>
            <label class="color-inline" title="Text and file color">
              <span>COLOR</span>
              <input id="contentColor" type="color" value="#55f3ff">
            </label>
          </div>
        </div>

        <button class="action-button">+ NEW FILE</button>
        <button class="action-button secondary">CHOOSE FOLDER</button>
      </aside>

      <section class="editor-panel">
        <div id="editor" class="editor"></div>

        <footer class="statusbar">
          <span><span class="status-dot"></span> READY</span>
          <span id="statusText">Password profile: apple</span>
        </footer>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
